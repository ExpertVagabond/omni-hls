name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m py_compile fmp4.py llhls.py hls_client.py bench.py
      - run: python -m pytest -q test_hls_packaging.py

  bench:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: mkdir -p out
      - name: Bench at the posted pace, 8192-byte slices, 5 runs
        run: |
          python bench.py --runs 5 --markdown --json out/bench-posted.json | tee out/bench-posted.md
      - name: Bench at the posted pace, 17-byte slices, 5 runs
        run: |
          python bench.py --source out/source.fmp4 --slice 17 --runs 5 --markdown --json out/bench-17.json | tee out/bench-17.md
      - name: Bench at pace 1.0 and 0.9
        run: |
          python bench.py --source out/source.fmp4 --pace 1.0 --markdown --json out/bench-1.0.json | tee out/bench-1.0.md
          python bench.py --source out/source.fmp4 --pace 0.9 --markdown --json out/bench-0.9.json | tee out/bench-0.9.md
      - name: Publish tables to the job summary
        run: |
          {
            echo "## omni-hls bench, ubuntu-latest, $(ffmpeg -version | head -1)"
            echo
            echo "### posted pace 1.161, 8192 B slices"; cat out/bench-posted.md; echo
            echo "### posted pace 1.161, 17 B slices"; cat out/bench-17.md; echo
            echo "### pace 1.0"; cat out/bench-1.0.md; echo
            echo "### pace 0.9"; cat out/bench-0.9.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-reports
          path: out/bench-*.json
